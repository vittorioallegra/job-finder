<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Software Engineer — Acme (Greenhouse fixture)</title>
  </head>
  <body>
    <h1>Software Engineer</h1>
    <form id="application_form" action="/submitted" method="post" accept-charset="utf-8">
      <div class="field">
        <label for="first_name">First Name <span>*</span></label>
        <input
          type="text"
          id="first_name"
          name="job_application[first_name]"
          required
          autocomplete="given-name"
        />
      </div>
      <div class="field">
        <label for="last_name">Last Name <span>*</span></label>
        <input
          type="text"
          id="last_name"
          name="job_application[last_name]"
          required
          autocomplete="family-name"
        />
      </div>
      <div class="field">
        <label for="email">Email <span>*</span></label>
        <input type="text" id="email" name="job_application[email]" required />
      </div>
      <div class="field">
        <label for="phone">Phone</label>
        <input type="tel" id="phone" name="job_application[phone]" />
      </div>
      <div class="field">
        <label for="location">Location (City)</label>
        <input type="text" id="location" name="job_application[location]" />
      </div>
      <div class="field">
        <label>Resume/CV <span>*</span></label>
        <input
          type="file"
          id="resume"
          name="job_application[resume]"
          accept=".pdf,.doc,.docx"
          style="display: none"
        />
        <button type="button">Attach</button>
      </div>
      <div class="field">
        <label>Cover Letter</label>
        <input
          type="file"
          id="cover_letter"
          name="job_application[cover_letter]"
          accept=".pdf,.doc,.docx"
        />
      </div>
      <div class="field">
        <label for="q_relocate">Are you willing to relocate?</label>
        <select id="q_relocate" name="job_application[answers_attributes][0][text_value]">
          <option value="">Select...</option>
          <option value="Yes">Yes</option>
          <option value="No">No</option>
        </select>
      </div>
      <div class="field">
        <label for="q_why">Why do you want to work here?</label>
        <textarea id="q_why" name="job_application[answers_attributes][1][text_value]"></textarea>
      </div>
      <div class="field">
        <label for="q_project">Describe a project you led end to end</label>
        <textarea
          id="q_project"
          name="job_application[answers_attributes][2][text_value]"
        ></textarea>
      </div>
      <div class="field" style="opacity: 0; position: absolute; left: -9999px">
        <label for="hp_site">Leave this field blank</label>
        <input
          type="text"
          id="hp_site"
          name="job_application[website]"
          tabindex="-1"
          autocomplete="off"
        />
      </div>
      <div class="field">
        <input type="checkbox" id="privacy" name="privacy" />
        <label for="privacy">I agree to the privacy policy</label>
      </div>
      <input type="submit" id="submit_app" value="Submit application" />
    </form>
  </body>
</html>
